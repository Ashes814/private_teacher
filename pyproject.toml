[project]
name = "private-teacher"
version = "0.1.0"
description = "Local-first private teacher LLM app"
readme = "README.md"
authors = [
    { name = "Ashes814", email = "1534661514@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "httpx>=0.28.1",
    "langchain>=1.3.11",
    "langchain-anthropic>=1.4.8",
    "langchain-core>=1.4.8",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.3.3",
    "loguru>=0.7.3",
    "nbformat>=5.10.4",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.6.1",
    "streamlit>=1.60.0",
    "tenacity>=9.1.4",
    "tiktoken>=0.13.0",
    "unstructured>=0.24.1",
]

[project.scripts]
private-teacher = "private_teacher:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "reportlab>=5.0.0",
    "respx>=0.23.1",
    "ruff>=0.15.20",
    "vcrpy>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认选项：
#   -ra: 显示所有跳过原因
#   -q: 简洁输出
#   --strict-markers: 未注册的 marker 报错（防止拼写错）
#   --strict-config: pytest 配置错误时报错
#   --cov=src/private_teacher: 跑覆盖率
#   --cov-report=term-missing: 终端输出 + 缺失行号
addopts = "-ra -q --strict-markers --strict-config --cov=src/private_teacher --cov-report=term-missing"

# 自定义 marker
markers = [
    "integration: 集成测试（可能涉及文件系统、慢）",
    "e2e: 端到端测试（需要完整环境）",
    "requires_llm: 需要真实 LLM API key（默认跳过）",
]

# pytest-asyncio 模式：自动识别 async 测试
asyncio_mode = "auto"

# ============================================================
# coverage 配置
# ============================================================
[tool.coverage.run]
# 覆盖率统计的源码目录
source = ["src/private_teacher"]
# 不统计的文件
omit = [
    "*/tests/*",
    "*/__main__.py",
    "*/__init__.py",
]

[tool.coverage.report]
# 低于 80% 覆盖率时 CI 失败（Phase 0 收尾标准）
fail_under = 80
# 缺失行显示
show_missing = true
# 排除某些行不计入覆盖率
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]


# ============================================================
# ruff 配置（lint + format）
# ============================================================
[tool.ruff]
# 单行最大字符数
line-length = 100
# 目标 Python 版本（决定可用语法）
target-version = "py311"
# 同时应用的目录
src = ["src", "tests"]
# 不检查的目录
extend-exclude = [
    ".venv",
    "data",
    "logs",
    "build",
    "dist",
]

[tool.ruff.lint]
# 启用的规则集
# E/W: pycodestyle 错误和警告
# F: pyflakes（未使用变量、未定义名称等）
# I: isort（import 排序）
# UP: pyupgrade（用新语法替代老语法）
# B: flake8-bugbear（常见 bug 模式）
# SIM: flake8-simplify（代码简化建议）
# C4: flake8-comprehensions（推导式建议）
# RUF: ruff 自身规则
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# 忽略的规则
ignore = [
    "E501",  # 行长度（已由 line-length 控制，不重复检查）
    "B008",  # 函数调用作为默认参数（如 dict() 在 default_factory 里）—— 业务常用，false positive 多
    "RUF003", # 中文注释字符
    "RUF002", # 中文注释字符
    "RUF001", # 中文注释字符
]

[tool.ruff.lint.per-file-ignores]
# 测试文件允许未使用 import（fixture 可能只在 conftest 里用）
"tests/**/*.py" = ["F401", "F811"]
# __init__.py 可能 import 仅用于 re-export
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
# import 排序：标准库 → 第三方 → 本项目
known-first-party = ["private_teacher"]
combine-as-imports = true

[tool.ruff.format]
# format 风格：与 black 兼容
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"


# ============================================================
# mypy 配置（静态类型检查）
# ============================================================
[tool.mypy]
# Python 版本
python_version = "3.11"
# 严格模式（开启所有严格选项）
# 包含 disallow_untyped_defs, no_implicit_optional, warn_unused_ignores 等
strict = true
# 允许未注解的 def（Phase 0 渐进式落地）
# 之后可以打开 disallow_untyped_defs = true
disallow_untyped_defs = false
# 不检查缺失的 import（langchain 等第三方库 type stub 不全）
ignore_missing_imports = true
# 不显示 "note" 级别（让输出更干净）
show_error_codes = true
# 输出简洁
pretty = true
# 按文件输出结果
show_absolute_path = false

# ⬇️ 禁用全局错误码（langchain stub 不全会误报）
disable_error_code = [
    "call-arg",   # 调用第三方库参数名误报
    "arg-type",   # SecretStr 类型不匹配误报
]

# ⬇️ 第三方库容忍度高
[[tool.mypy.overrides]]
module = [
    "loguru",
    "loguru.*",
    "tenacity",
    "tenacity.*",
    "unstructured",
    "unstructured.*",
]
ignore_missing_imports = true
ignore_errors = false  # 这几个我们没用到，先不忽略

# ⬇️ langchain 强制忽略（类型 stub 不全）
[[tool.mypy.overrides]]
module = [
    "langchain",
    "langchain.*",
    "langchain_anthropic",
    "langchain_anthropic.*",
    "langchain_openai",
    "langchain_openai.*",
    "langchain_ollama",
    "langchain_ollama.*",
    "langchain_core",
    "langchain_core.*",
]
ignore_errors = true

# ⬇️ 新增：禁用全局特定错误码
disable_error_code = [
    "call-arg",     # 调用第三方库的参数不匹配（langchain stub 不全）
    "arg-type",     # 同上
]

# 测试文件可以松一点
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

